name: Validate skills

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate-skills:
    name: Validate repository skills
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Validate skills
        run: node scripts/validate-skills.mjs
